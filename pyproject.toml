[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remarksync"
version = "0.1.0"
description = "Local-first library, viewer, search and format compiler for reMarkable documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "rmscene>=0.8",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# local handwriting recognition (TrOCR); install PyTorch with CUDA first from
# https://download.pytorch.org/whl/cu124 for GPU speed
handwriting = ["torch", "torchvision", "transformers<5", "pillow", "sentencepiece", "tiktoken", "protobuf"]
# the alternative engine: the built-in Windows ink recogniser
windows-ink = ["winrt-runtime", "winrt-Windows.UI.Input.Inking", "winrt-Windows.Foundation", "winrt-Windows.Foundation.Collections", "winrt-Windows.Foundation.Numerics"]

[project.scripts]
remarksync = "remarksync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
