[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remarksync"
version = "0.1.0"
description = "reMarkable backup viewer, local search, Markdown compiler, cloud sync and original-PDF preservation"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 (license = "MIT" with license-files) needs setuptools>=77 and
# packaging>=24.2 at build time; the table form keeps the existing floor and
# setuptools includes LICENSE by default either way.
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "rmscene>=0.8",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]
server = ["cryptography>=46"]
# local handwriting recognition (TrOCR); install PyTorch with CUDA first from
# https://download.pytorch.org/whl/cu124 for GPU speed
handwriting = ["torch", "torchvision", "transformers<5", "pillow", "sentencepiece", "tiktoken", "protobuf"]
# the alternative engine: the built-in Windows ink recogniser
windows-ink = ["winrt-runtime", "winrt-Windows.UI.Input.Inking", "winrt-Windows.Foundation", "winrt-Windows.Foundation.Collections", "winrt-Windows.Foundation.Numerics"]

[project.scripts]
remarksync = "remarksync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: needs a real backup and the desktop app's store (see tests/real/conftest.py)"]

[tool.ruff]
# Long lines are the house style here; prose in docstrings carries the
# reasoning and wrapping it would hurt more than help.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes only, deliberately. It catches the things that silently accumulate
# and that nothing else was catching: unused imports, unused locals, names
# that do not exist. Style rules are left off so the linter never argues with
# the existing code, only reports what is actually dead or broken.
select = ["F"]
