[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remarksync"
version = "0.1.0"
description = "Local-first library, viewer, search and format compiler for reMarkable documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "rmscene>=0.6",
    "rmc>=0.2",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
remarksync = "remarksync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
